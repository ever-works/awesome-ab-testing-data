markdown: >-
  ## Overview


  Wingify Platform is an enterprise experimentation and optimization platform
  that unifies analytics, experimentation, personalization, feature management,
  and engagement on a single customer profile. The platform includes six product
  offerings running on one shared foundation.


  ## Product Offerings


  - **Experimentation**: Website experimentation built for non-technical teams

  - **Personalization**: Real-time adaptive personalization

  - **Analyze**: Heatmaps, session recordings, funnels, and surveys

  - **Feature Management**: Feature flagging, rollouts, and server-side
  experimentation

  - **Commerce**: Semantic search, product & content recommendations, and
  merchandising

  - **Engage**: Behavior-triggered browser push notifications


  ## Deployment


  Cloud deployment with data centers in the US, the EU, and India. Website
  experiments deploy via a SmartCode snippet; feature management requires SDK
  integration into the codebase.


  ## Integrations


  Wingify integrates with tools across the marketing and product stack. Full
  integration details are available at wingify.com/integrations/.


  ## Pricing


  Paid commercial software. Offers a 30-day free trial with no credit card
  required. Demo and guided onboarding available.


  ## Security & Compliance


  ISO 27001 ISMS, ISO 27701 PIMS, ISO 27017 Cloud security, ISO 27018 Cloud
  Privacy, PCI DSS v4.0.1, SOC 2 Type II, GDPR, CCPA, and HIPAA compliant. 24/7
  priority support with a dedicated success manager.
