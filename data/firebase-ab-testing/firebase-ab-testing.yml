markdown: >-
  ## Overview


  Firebase A/B Testing is a free experimentation service within Google's
  Firebase mobile and web application development platform.


  ## Features


  - A/B testing for Android, iOS, and web apps

  - Integration with Firebase Remote Config

  - Integration with Google Analytics for Firebase

  - Experiment goal and variant configuration

  - Statistical significance reporting

  - Experiment scheduling


  ## Pricing


  Free as part of the Firebase Spark (no-cost) plan.
