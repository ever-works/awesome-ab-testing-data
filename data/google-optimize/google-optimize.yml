markdown: >-
  ## Overview


  Google Optimize was a free A/B testing and personalization tool from Google
  that integrated with Google Analytics.


  ## Features


  - A/B testing and multivariate testing

  - Personalization and targeting

  - Visual editor for content changes

  - Integration with Google Analytics

  - Experiment reporting


  ## Pricing


  Free.


  ## Discontinuation


  Google Optimize was discontinued on September 30, 2023.
