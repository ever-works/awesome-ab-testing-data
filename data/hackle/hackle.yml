markdown: >-
  ## Overview


  Hackle is a Korean experimentation and feature flag platform that enables A/B
  testing and feature management for web and mobile applications.


  ## Features


  - A/B testing for web and mobile

  - Feature flag management

  - SDKs for multiple platforms

  - Experiment metrics and real-time results

  - User targeting and segmentation


  ## Pricing


  Freemium model with paid plans for advanced features and higher volume.
